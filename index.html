<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grădina Mea – organizator de grădinărit</title>
  <meta name="description" content="Calendar inteligent pentru grădină: sarcini adaptate locației și vremii, de la semănat la recoltare și tăieri.">
  <meta name="theme-color" content="#2f6b3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grădina Mea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script>
    /* tema: luminos (implicit) / întunecat / automat după sistem */
    (function () {
      var t = 'light'; try { t = localStorage.getItem('gradina.theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      var m = document.querySelector('meta[name=theme-color]'); if (m && dark) m.content = '#161b14';
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#azi"><span class="brand-ico">🌱</span><span class="brand-txt">Grădina Mea</span></a>
      <div class="top-right">
        <select id="gardenSel" class="garden-sel" aria-label="Alege grădina"></select>
        <button class="icon-btn" id="installBtn" hidden title="Instalează aplicația">⬇️ <span class="hide-sm">Instalează</span></button>
        <button class="icon-btn bell" id="bellBtn" data-act="bell" title="Alerte" hidden>🔔<span id="bellCnt" class="bell-cnt" hidden>0</span></button>
        <button class="avatar" id="userBtn" title="Utilizator"></button>
      </div>
    </header>
    <nav class="nav" id="nav" hidden>
      <a href="#azi" data-v="azi"><span>🏡</span><b>Azi</b></a>
      <a href="#calendar" data-v="calendar"><span>📅</span><b>Calendar</b></a>
      <a href="#gradina" data-v="gradina"><span>🌿</span><b>Grădina mea</b></a>
      <a href="#setari" data-v="setari"><span>⚙️</span><b>Setări</b></a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="sheet" class="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" role="dialog" aria-modal="true"><button class="sheet-x" data-close aria-label="Închide">✕</button><div id="sheetBody"></div></div></div>
  <div id="toast" class="toast" hidden></div>
  <noscript>Aplicația are nevoie de JavaScript.</noscript>

  <script src="data-plants.js"></script>
  <script src="data-tasks.js"></script>
  <script src="weather.js"></script>
  <script src="engine.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
